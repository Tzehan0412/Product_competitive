product_profiling_task:
  description: >
    分析用戶提供的產品描述："{product_description}"

    請完成以下工作：
    1. 識別產品所屬的市場領域（如：SaaS、電商、教育科技、健康管理等）。
    2. 提煉核心功能清單（列出 3~8 個主要功能）。
    3. 判斷目標客群（B2B / B2C / 兩者皆有，以及具體的用戶畫像）。
    4. 識別關鍵技術特徵（如：AI、區塊鏈、即時通訊等）。
    5. 產出 5~10 組搜尋關鍵字，用於後續競品搜尋。

    產出格式必須為結構化的產品輪廓。
  expected_output: >
    一份結構化的產品輪廓 (Product Profile)，包含：
    - 產品領域
    - 核心功能清單
    - 目標客群描述
    - 關鍵技術特徵
    - 建議搜尋關鍵字組合
  agent: product_profiler

competitor_scouting_task:
  description: >
    根據產品輪廓中的搜尋關鍵字，使用搜尋工具找出 3~5 個最相關的競爭產品。

    執行步驟：
    1. 使用產品輪廓提供的搜尋關鍵字組合，進行多輪搜尋。
    2. 從搜尋結果中篩選出與用戶產品功能重疊度最高的產品。
    3. 排除明顯不相關的結果（如：新聞文章、教學文、招聘頁面）。
    4. 對每個競品提供：名稱、官網 URL、一句話描述。

    注意：只收錄真實存在且可查證的產品，嚴禁虛構。
  expected_output: >
    一份競品清單，包含 3~5 個競爭產品，每個競品有：
    - 產品名稱
    - 官網或產品頁面 URL
    - 一句話描述（該產品是什麼、做什麼）
  agent: competitor_scout

competitor_analysis_task:
  description: >
    針對競品清單中的每一個競品，進行深度分析：

    1. **功能比較**：搜尋每個競品的功能列表，與用戶產品的核心功能逐一比對。
    2. **定價分析**：搜尋每個競品的價格方案（免費版、付費版、企業版等）。
    3. **用戶評價**：搜尋用戶對該競品的評價與常見抱怨。
    4. **SWOT 分析**：為每個競品產出 Strengths / Weaknesses / Opportunities / Threats。

    最後產出一份「功能比較矩陣表」，橫軸為各產品（含用戶產品），縱軸為功能項目，
    用 O（有）/ X（無）/ △（部分支援）標示。
  expected_output: >
    一份完整的競品深度分析報告，包含：
    - 各競品的功能、定價、用戶評價摘要
    - 各競品的 SWOT 分析
    - 功能比較矩陣表（用戶產品 vs 所有競品）
  agent: competitor_analyst

strategy_summary_task:
  description: >
    根據前面所有分析結果，為用戶產品產出一份策略建議報告：

    1. **競爭優勢**：用戶產品相較競品，有哪些獨特賣點 (USP)？
    2. **需補強項目**：哪些功能是競品普遍具備但用戶產品缺乏的？優先補強順序？
    3. **市場機會**：競品尚未滿足的市場需求是什麼？用戶產品可以如何切入？
    4. **潛在威脅**：哪些競品動態可能對用戶產品造成衝擊？
    5. **行動建議**：列出 3~5 項具體的短期行動方案。

    報告語言使用繁體中文，格式清晰、結論明確。
  expected_output: >
    一份競品分析策略報告，包含：
    - 競爭優勢與獨特賣點
    - 需補強的功能缺口與優先順序
    - 市場機會分析
    - 潛在威脅警示
    - 3~5 項具體行動建議
  agent: strategy_advisor

ad_angle_planning_task:
  description: >
    請執行以下兩個步驟來完成最終報告：

    1. **整合策略摘要**：回顧 strategy_summary_task 產出的競爭優勢、市場機會與行動建議。
    2. **規劃廣告切角**：基於上述分析，為產品設計至少三個行銷切角。包含：
       - 受眾焦慮洞察
       - Hook 文案設計 (3秒吸睛標語)
       - 視覺呈現建議
       - 心理觸發機制
    
    最終報告必須是一份結構完整的繁體中文文檔，包含「競品策略分析」與「廣告實戰切角」兩大模組。
  expected_output: >
    一份整合型的產品行銷戰略報告。
    格式需包含：
    一、產品競爭優勢與策略總結 (來自前序分析)
    二、3~5 項具體短期行動方案
    三、三大差異化廣告切角矩陣 (含文案與視覺構想)
    四、投放渠道建議
  agent: advertising_planning
